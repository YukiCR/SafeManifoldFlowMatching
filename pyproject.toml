[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-manifold-flow-matching"
version = "0.1.0"
description = "RFMP learning and generation-time geometric safety on product spheres"
requires-python = ">=3.12"
dependencies = ["torch>=2.1", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
